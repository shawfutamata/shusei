name: Blog weekly

# 毎週火曜 10:00 JST（= 01:00 UTC）に記事を1本作って公開する。
# 手動実行もできる。初回は必ず dry_run で中身を見てから自動公開に切り替えること。
on:
  schedule:
    - cron: '0 1 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '生成だけして公開しない'
        type: boolean
        default: true

jobs:
  publish:
    name: 記事の生成と公開
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 自己テスト
        run: node blog-automation/src/selftest.mjs

      - name: 記事を作る
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_ACCOUNT_ID: ${{ secrets.WIX_ACCOUNT_ID }}
          WIX_MEMBER_ID: ${{ secrets.WIX_MEMBER_ID }}
        run: |
          node blog-automation/src/run-weekly.mjs \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # 薬機法チェックで止まった記事もここに残る。落ちた回ほど中身を見ること。
      - name: 生成物を残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-output
          path: blog-automation/output/
          retention-days: 90
