<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="TASUKI">
  <title>TASUKI</title>
  <defs>
    <!-- 外は角丸の四角（辺が少し平ら）、内はたすきが交差してできる木の葉。
         差分がリングになる。 -->
    <path id="tasuki-ring" fill-rule="evenodd" d="
      M80 6 H120 A74 74 0 0 1 194 80 V120 A74 74 0 0 1 120 194 H80 A74 74 0 0 1 6 120 V80 A74 74 0 0 1 80 6 Z
      M100 16 C168 58 168 142 100 184 C32 142 32 58 100 16 Z" />
    <!-- 分け目は少し斜め。上では紺が右へ、下では水色が左へ渡る。たすきの交差。 -->
    <clipPath id="tasuki-left"><path d="M0 0 H110 L90 200 H0 Z" /></clipPath>
    <clipPath id="tasuki-right"><path d="M110 0 H200 V200 H90 Z" /></clipPath>
    <clipPath id="tasuki-ring-clip"><use href="#tasuki-ring" /></clipPath>
    <linearGradient id="tasuki-navy" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0a3f8f" />
      <stop offset="1" stop-color="#1565cc" />
    </linearGradient>
    <linearGradient id="tasuki-sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#28a8ef" />
      <stop offset="1" stop-color="#5fd0fb" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tasuki-left)"><use href="#tasuki-ring" fill="url(#tasuki-navy)" /></g>
  <g clip-path="url(#tasuki-right)"><use href="#tasuki-ring" fill="url(#tasuki-sky)" /></g>

  <!-- 左右の中ほどに橙。たすきを受け渡す一点。帯の幅いっぱいに掛ける。 -->
  <g clip-path="url(#tasuki-ring-clip)" fill="#f4501e">
    <rect x="0" y="88" width="54" height="25" />
    <rect x="146" y="88" width="54" height="25" />
  </g>
</svg>
