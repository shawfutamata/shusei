<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="TASUKI">
  <title>TASUKI</title>
  <defs>
    <!-- 外は角丸の四角、内はたすきが交差してできる木の葉。差分がリングになる。 -->
    <path id="tasuki-ring" fill-rule="evenodd" d="
      M86 6 H114 A80 80 0 0 1 194 86 V114 A80 80 0 0 1 114 194 H86 A80 80 0 0 1 6 114 V86 A80 80 0 0 1 86 6 Z
      M100 30 C50 62 50 138 100 170 C150 138 150 62 100 30 Z" />
    <!-- 分け目を斜めにすると、上は水色、下は紺が相手側へ渡る。たすきの交差。 -->
    <clipPath id="tasuki-left"><path d="M0 0 H80 L120 200 H0 Z" /></clipPath>
    <clipPath id="tasuki-right"><path d="M80 0 H200 V200 H120 Z" /></clipPath>
    <clipPath id="tasuki-ring-clip"><use href="#tasuki-ring" /></clipPath>
    <linearGradient id="tasuki-navy" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#06397f" />
      <stop offset="1" stop-color="#1160bf" />
    </linearGradient>
    <linearGradient id="tasuki-sky" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#199fe8" />
      <stop offset="1" stop-color="#52cbfb" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tasuki-left)"><use href="#tasuki-ring" fill="url(#tasuki-navy)" /></g>
  <g clip-path="url(#tasuki-right)"><use href="#tasuki-ring" fill="url(#tasuki-sky)" /></g>

  <!-- 左右の中ほどに橙。たすきを受け渡す一点。 -->
  <g clip-path="url(#tasuki-ring-clip)" fill="#f4501e">
    <rect x="0" y="86" width="48" height="28" />
    <rect x="152" y="86" width="48" height="28" />
  </g>
</svg>
